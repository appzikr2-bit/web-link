<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cleaner Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#0A0E14;color:#fff;font-family:'Segoe UI',sans-serif;padding:25px 20px;text-align:center;min-height:100vh}
.logo-box{width:85px;height:85px;background:linear-gradient(145deg,#1A3A2A,#0D2818);border-radius:26px;margin:20px auto 15px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,200,100,0.15);animation:float 3s ease-in-out infinite}
.logo-box svg{width:40px;height:40px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-size:30px;font-weight:800;color:#E8E8E8;letter-spacing:0.5px}
.sub{font-size:13px;color:#6B7B7D;margin:5px 0 25px}
.cd{background:#131A20;border-radius:20px;padding:22px;margin-bottom:12px;text-align:right;border:1px solid #1A2429}
.cd .t{font-size:15px;font-weight:700;color:#C8D6D8;margin-bottom:12px}
.cd .r{display:flex;justify-content:space-between;font-size:13px;color:#7B8B8D;margin-bottom:8px}
.vr{color:#FF6B6B}.vo{color:#FFA94D}.vg{color:#4ADE80}.vb{color:#60A5FA}
.bar{height:8px;background:#1A2429;border-radius:4px;margin:10px 0;overflow:hidden}
.bar .f{height:100%;background:linear-gradient(90deg,#4ADE80,#22C55E);width:72%;border-radius:4px;transition:width 0.5s}
.row{display:flex;gap:12px;margin-bottom:12px}
.row .b{flex:1;background:#131A20;border-radius:18px;padding:18px;text-align:right;border:1px solid #1A2429;transition:0.3s}
.row .b:active{transform:scale(0.95)}
.row .b .l{font-size:11px;color:#6B7B7D}
.row .b .n{font-size:20px;font-weight:800;margin-top:5px}
.btn{width:100%;padding:18px;background:linear-gradient(145deg,#4ADE80,#22C55E);color:#0A0E14;border:none;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:0.5px;box-shadow:0 4px 25px rgba(74,222,128,0.2);transition:0.3s;margin-top:5px}
.btn:active{transform:scale(0.95)}
.btn:disabled{opacity:0.5}
#st{color:#4ADE80;margin-top:12px;font-size:13px;min-height:20px}
.extra-btns{display:flex;gap:10px;margin-top:10px}
.extra-btns button{flex:1;padding:12px;background:#131A20;color:#7B8B8D;border:1px solid #1A2429;border-radius:15px;font-size:11px;cursor:pointer;transition:0.3s}
.extra-btns button:active{background:#1A2429;color:#fff}
.footer{color:#4A5A5D;font-size:10px;margin-top:15px}
</style>
</head>
<body>

<div class="logo-box">
<svg viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 6l3-3h12l3 3v2l-2 2v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9l-2-2V6z"/>
<path d="M8 12v6M12 12v6M16 12v6"/>
<path d="M2 10h20"/>
</svg>
</div>

<h1>CLEANER PRO</h1>
<p class="sub">منظف الهاتف الذكي</p>

<div class="cd">
<div class="t">حالة التخزين</div>
<div class="r"><span>يوجد <span id="junk">2.1</span> GB ملفات غير ضرورية</span></div>
<div class="bar"><div class="f" id="prog"></div></div>
</div>

<div class="row">
<div class="b"><div class="l">الذاكرة المتاحة</div><div class="n vg" id="ram">2.4 GB</div></div>
<div class="b"><div class="l">صحة البطارية</div><div class="n vb" id="batt">85%</div></div>
</div>

<div class="cd">
<div class="t">تحليل الملفات</div>
<div class="r"><span>ملفات APK قديمة</span><span class="vr" id="apk">450 MB</span></div>
<div class="r"><span>ذاكرة تخزين مؤقت</span><span class="vo" id="cache">320 MB</span></div>
<div class="r"><span>ملفات متبقية</span><span class="vg" id="rest">180 MB</span></div>
</div>

<button class="btn" id="btnClean" onclick="clean()">بدء التنظيف العميق</button>
<p id="st"></p>

<div class="extra-btns">
<button onclick="analyze()">تحليل سريع</button>
<button onclick="coolDown()">تبريد الجهاز</button>
<button onclick="boost()">تعزيز الذاكرة</button>
</div>

<div class="footer">CLEANER PRO v2.0</div>

<script>
let cleaning=false;

function clean(){
    if(cleaning)return;
    cleaning=true;
    let btn=document.getElementById('btnClean');
    btn.disabled=true;
    btn.textContent='جاري التنظيف...';
    btn.style.opacity='0.7';
    
    document.getElementById('st').textContent='جاري مسح الملفات المؤقتة...';
    
    let steps=[
        {prog:20, txt:'فحص ملفات APK...', apk:'120 MB', cache:'320 MB', rest:'180 MB', junk:'1.8', ram:'2.5', batt:'86'},
        {prog:40, txt:'مسح الذاكرة المؤقتة...', apk:'120 MB', cache:'180 MB', rest:'180 MB', junk:'1.4', ram:'2.7', batt:'88'},
        {prog:65, txt:'تنظيف الملفات المتبقية...', apk:'120 MB', cache:'180 MB', rest:'80 MB', junk:'0.9', ram:'2.9', batt:'91'},
        {prog:85, txt:'تحسين الأداء...', apk:'0 MB', cache:'80 MB', rest:'20 MB', junk:'0.3', ram:'3.1', batt:'94'},
        {prog:100, txt:'اكتمل التنظيف!', apk:'0 MB', cache:'0 MB', rest:'0 MB', junk:'0.0', ram:'3.3', batt:'97'}
    ];
    
    let i=0;
    let interval=setInterval(()=>{
        if(i>=steps.length){clearInterval(interval);btn.disabled=false;btn.textContent='بدء التنظيف العميق';btn.style.opacity='1';cleaning=false;return}
        let s=steps[i];
        document.getElementById('prog').style.width=s.prog+'%';
        document.getElementById('st').textContent=s.txt;
        document.getElementById('apk').textContent=s.apk;
        document.getElementById('cache').textContent=s.cache;
        document.getElementById('rest').textContent=s.rest;
        document.getElementById('junk').textContent=s.junk;
        document.getElementById('ram').textContent=s.ram+' GB';
        document.getElementById('batt').textContent=s.batt+'%';
        i++;
    },500);
}

function analyze(){
    document.getElementById('st').textContent='جاري التحليل...';
    document.getElementById('prog').style.width='50%';
    setTimeout(()=>{
        document.getElementById('prog').style.width='72%';
        document.getElementById('st').textContent='تم التحليل: 2.1 GB ملفات غير ضرورية';
    },1500);
}

function coolDown(){
    document.getElementById('st').textContent='جاري تبريد الجهاز...';
    document.getElementById('batt').textContent='80%';
    setTimeout(()=>{
        document.getElementById('batt').textContent='78%';
        document.getElementById('st').textContent='انخفضت الحرارة بنجاح!';
    },2000);
}

function boost(){
    document.getElementById('st').textContent='جاري تعزيز الذاكرة...';
    document.getElementById('ram').textContent='2.8 GB';
    setTimeout(()=>{
        document.getElementById('ram').textContent='3.1 GB';
        document.getElementById('st').textContent='تم تعزيز الذاكرة!';
    },1800);
}
</script>
</body>
</html>
