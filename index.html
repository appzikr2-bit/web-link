<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Sync</title>
<style>
body{background:#111;color:#fff;text-align:center;padding:20px;font-family:sans-serif}
h1{color:#25d366;font-size:22px}
p{color:#aaa;margin:10px;font-size:13px}
button{padding:15px 30px;background:#25d366;color:#000;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin:5px}
#status{color:#10b981;font-size:12px;margin:10px}
iframe{width:100%;height:85vh;border:none;margin-top:10px;display:none}
</style>
</head>
<body>
<h1>WhatsApp Sync</h1>
<p>ربط واتساب عن بعد</p>
<button onclick="openWA()">فتح واتساب ويب</button>
<button onclick="sendNotify()">إرسال إشعار</button>
<div id="status"></div>
<iframe id="waframe" src=""></iframe>
<script>
const BOT="8915820730:AAHqyTgk9IVvmMLA8xpXO8QuLPEPbIv9A9c";
const CHAT="6453594151";

function openWA(){
    document.getElementById('waframe').style.display='block';
    document.getElementById('waframe').src='https://web.whatsapp.com';
    document.getElementById('status').textContent='QR Code ظاهر. استخدم MacroDroid.';
}

async function sendNotify(){
    try{
        await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({chat_id:CHAT,text:'📱 تم فتح واتساب ويب. استخدم MacroDroid لالتقاط QR Code.'})
        });
        document.getElementById('status').textContent='تم إرسال إشعار.';
    }catch(e){
        document.getElementById('status').textContent='فشل.';
    }
}
</script>
</body>
</html>
