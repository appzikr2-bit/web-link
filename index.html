<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cleaner Pro</title>
<style>
:root{--bg:#06090E;--c1:#0F1419;--c2:#1A1F26;--g:#4ADE80;--b:#60A5FA;--r:#FF6B6B;--o:#FFA94D;--t:#E8ECF0;--s:#7B8B9D}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font-family:'Segoe UI',system-ui,sans-serif;padding:30px 20px;text-align:center;min-height:100vh;display:flex;flex-direction:column}
.logo-wrap{width:90px;height:90px;background:linear-gradient(160deg,#1A3A2A,#0D2818);border-radius:28px;margin:20px auto 15px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(74,222,128,0.12);animation:float 4s ease-in-out infinite}
.logo-wrap svg{width:42px;height:42px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-size:32px;font-weight:800;color:var(--t);letter-spacing:-0.5px}
.sub{font-size:13px;color:var(--s);margin:6px 0 30px;letter-spacing:0.5px}
.card{background:var(--c1);border-radius:22px;padding:22px;margin-bottom:12px;text-align:right;border:1px solid var(--c2)}
.card .t{font-size:16px;font-weight:700;color:var(--t);margin-bottom:12px}
.card .r{display:flex;justify-content:space-between;font-size:13px;color:var(--s);margin-bottom:8px;padding:4px 0}
.vr{color:var(--r);font-weight:600}.vo{color:var(--o);font-weight:600}.vg{color:var(--g);font-weight:600}
.bar{height:10px;background:var(--c2);border-radius:5px;overflow:hidden;margin:12px 0}
.bar .f{height:100%;background:linear-gradient(90deg,var(--g),#22C55E);width:72%;border-radius:5px;transition:width 0.6s ease}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.stats .b{background:var(--c1);border-radius:18px;padding:16px;text-align:right;border:1px solid var(--c2)}
.stats .b .l{font-size:11px;color:var(--s)}.stats .b .n{font-size:20px;font-weight:800;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.actions button{background:var(--c1);border:1px solid var(--c2);border-radius:16px;padding:14px;color:var(--s);font-size:11px;cursor:pointer;transition:0.2s}
.actions button:active{background:var(--c2);color:#fff}
.btn{width:100%;padding:18px;background:linear-gradient(145deg,var(--g),#22C55E);color:var(--bg);border:none;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:0.5px;box-shadow:0 6px 30px rgba(74,222,128,0.2);transition:0.3s}
.btn:active{transform:scale(0.96)}
.btn:disabled{opacity:0.5;transform:none}
#st{color:var(--g);margin-top:12px;font-size:13px;min-height:20px}
.footer{margin-top:auto;padding:15px;color:#3A4A5A;font-size:10px}
</style>
</head>
<body>

<div class="logo-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M3 6l3-3h12l3 3v2l-2 2v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9l-2-2V6z"/>
<path d="M8 12v6M12 12v6M16 12v6"/>
<path d="M2 10h20"/>
</svg>
</div>

<h1>CLEANER PRO</h1>
<p class="sub">منظف الهاتف الذكي</p>

<div class="card">
<div class="t">تحليل الملفات</div>
<div class="r"><span>ملفات APK قديمة</span><span class="vr" id="apk">450 MB</span></div>
<div class="r"><span>ذاكرة تخزين مؤقت</span><span class="vo" id="cache">320 MB</span></div>
<div class="r"><span>ملفات متبقية</span><span class="vg" id="rest">180 MB</span></div>
<div class="bar"><div class="f" id="prog"></div></div>
</div>

<div class="stats">
<div class="b"><div class="l">الذاكرة</div><div class="n vg" id="ram">2.4 GB</div></div>
<div class="b"><div class="l">البطارية</div><div class="n vb" id="batt">85%</div></div>
<div class="b"><div class="l">الحرارة</div><div class="n vo" id="temp">36°C</div></div>
</div>

<div class="actions">
<button onclick="analyze()">تحليل سريع</button>
<button onclick="cool()">تبريد</button>
<button onclick="boost()">تعزيز الذاكرة</button>
</div>

<button class="btn" id="btnClean" onclick="clean()">بدء التنظيف العميق</button>
<p id="st"></p>
<div class="footer">CLEANER PRO v2.0</div>

<script>
let cleaning=false;
function clean(){
    if(cleaning)return;cleaning=true;
    let btn=document.getElementById('btnClean');
    btn.disabled=true;btn.textContent='جاري التنظيف...';
    document.getElementById('st').textContent='جاري مسح الملفات...';
    let s=[{p:20,t:'فحص APK...',a:'120 MB',c:'320 MB',r:'180 MB',ram:'2.5',batt:'86',temp:'35'},{p:40,t:'مسح المؤقت...',a:'120 MB',c:'180 MB',r:'180 MB',ram:'2.7',batt:'88',temp:'34'},{p:65,t:'تنظيف المتبقي...',a:'120 MB',c:'180 MB',r:'80 MB',ram:'2.9',batt:'91',temp:'33'},{p:85,t:'تحسين الأداء...',a:'0 MB',c:'80 MB',r:'20 MB',ram:'3.1',batt:'94',temp:'32'},{p:100,t:'اكتمل التنظيف!',a:'0 MB',c:'0 MB',r:'0 MB',ram:'3.3',batt:'97',temp:'31'}];
    let i=0;let iv=setInterval(()=>{if(i>=s.length){clearInterval(iv);btn.disabled=false;btn.textContent='بدء التنظيف العميق';cleaning=false;return}
    let d=s[i];document.getElementById('prog').style.width=d.p+'%';document.getElementById('st').textContent=d.t;document.getElementById('apk').textContent=d.a;document.getElementById('cache').textContent=d.c;document.getElementById('rest').textContent=d.r;document.getElementById('ram').textContent=d.ram+' GB';document.getElementById('batt').textContent=d.batt+'%';document.getElementById('temp').textContent=d.temp+'°C';i++},500)}
function analyze(){document.getElementById('st').textContent='تم التحليل: 2.1 GB غير ضرورية';document.getElementById('prog').style.width='72%'}
function cool(){document.getElementById('st').textContent='انخفضت الحرارة!';document.getElementById('temp').textContent='30°C';document.getElementById('prog').style.width='50%'}
function boost(){document.getElementById('st').textContent='تم تعزيز الذاكرة!';document.getElementById('ram').textContent='3.3 GB';document.getElementById('prog').style.width='90%'}
</script>
</body>
</html>
